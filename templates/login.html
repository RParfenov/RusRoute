<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RusRoute — регистрация</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Favicon -->
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='RusRoute.png') }}">
        <!-- Подключение CSS -->
        <link rel="stylesheet" href="{{ url_for('static', filename='login_style.css') }}">
    </head>
    <body>
        <!-- ШАПКА -->
        <header class="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="{{ url_for('static', filename='RusRoute.png') }}" alt="Логотип RusRoute">
                    RusRoute
                </a>
                <button class="btn btn-outline-light" onclick="window.location.href='/'">Вернуться на главную</button>
            </div>
        </header>
        <div class="main-content">
            <div class="form-container">
                <h2 class="form-title">Вход в аккаунт</h2>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for msg in messages %}
                            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                                {{ msg }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- ФОРМА ЛОГИНА -->
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
                </div>
            </div>
        </div>
         <!-- ФУТЕР - САМАЯ НИЖНЯЯ ЧАСТЬ -->
        <footer>
            <div class="footer-authors">
                <span>© 2025 RusRoute, ПсковГУ (Парфенов Р., Журавлев И.)</span>
            </div>
            <div class="footer-links">
                <a href="https://t.me/" target="_blank" aria-label="Telegram">
                    <img src="https://data.chpic.su/stickers/l/LogoIconMa/LogoIconMa_002.webp" width="24" height="24" alt="Telegram">
                </a>
                <a href="https://github.com/RParfenov/RusRoute" target="_blank" aria-label="GitHub">GitHub</a>
            </div>
        </footer>
        
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
