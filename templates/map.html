<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RusRoute — выбор маршрута</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Favicon -->
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='RusRoute.png') }}">
        <!-- Подключение CSS -->
        <link rel="stylesheet" href="{{ url_for('static', filename='plan_style.css') }}">
    </head>
    <body>
        <!-- ШАПКА -->
        <header class="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="{{ url_for('static', filename='RusRoute.png') }}" alt="Логотип RusRoute">
                    RusRoute
                </a>
                <div>
                    <button class="btn btn-outline-light" onclick="window.location.href='/'">Вернуться на главную</button>
                    <button class="btn btn-outline-light" onclick="window.location.href='/plan'">Вернуться к поиску</button>
                    <button class="btn btn-outline-light" onclick="window.location.href='/history'">Посмотреть историю</button>
                    <button class="btn btn-outline-light" onclick="window.location.href='/logout'">Выйти из системы</button>
                </div>
            </div>
        </header>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main class="main-content">
            <div class="route-info">
                <!-- Карта -->
                <div class="map-area">
                    <iframe
                        src="{{ map_url }}"
                        frameborder="0"
                        scrolling="no"
                        marginheight="0"
                        marginwidth="0"
                        style="border: none; border-radius: 8px; width: 100%; height: 100%;">
                    </iframe>
                </div>
            </div>
        </main>

         <!-- ФУТЕР - САМАЯ НИЖНЯЯ ЧАСТЬ -->
        <footer>
            <div class="footer-authors">
                <span>© 2025 RusRoute, ПсковГУ (Парфенов Р., Журавлев И.)</span>
            </div>
            <div class="footer-links">
                <a href="https://github.com/RParfenov/RusRoute" target="_blank" aria-label="GitHub">GitHub</a>
            </div>
        </footer>

        <!-- Скрипты -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
