<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RusRoute — выбор маршрута</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Favicon -->
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='RusRoute.png') }}">
        <!-- Подключение CSS -->
        <link rel="stylesheet" href="{{ url_for('static', filename='plan_style.css') }}">
    </head>
    <body>
        <!-- ШАПКА -->
        <header class="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="{{ url_for('static', filename='RusRoute.png') }}" alt="Логотип RusRoute">
                    RusRoute
                </a>
                <div>
                    <button class="btn btn-outline-light" onclick="window.location.href='/'">Вернуться на главную</button>
                    <button class="btn btn-outline-light" onclick="window.location.href='/history'">Посмотреть историю</button>
                    <button class="btn btn-outline-light" onclick="window.location.href='/logout'">Выйти из системы</button>
                </div>
            </div>
        </header>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main class="main-content">
            <div class="search-container">
                <div class="city-inputs">
                    <div class="city-card">
                        <span class="city-card-label">Откуда:</span>
                        <div class="autocomplete">
                            <input type="text" id="extra-city1" name="city_from" value="Москва" class="city-input" required>
                        </div>
                    </div>

                    <div class="city-card">
                        <span class="city-card-label">Куда:</span>
                        <div class="autocomplete">
                            <input type="text" id="extra-city2" name="city_to" value="Казань" class="city-input" required>
                        </div>
                    </div>

                    <div class="date-card">
                        <span class="date-card-label">Начало путешествия:</span>
                        <div class="autocomplete">
                            <input type="text" id="extra-date1" name="date-from" value="2025-11-01" class="date-input" required>
                        </div>
                    </div>
                </div>

                <div class="btn-container">
                    <button class="show-route-btn" onclick="showMapPreview()">Показать города на карте</button>
                </div>

                <div id="map-preview" style="display: none; margin-top: 20px;">
                    <div class="route-info">
                        <h5>Карта маршрута</h5>
                        <div class="map-area">
                            <img id="map-image" src="" alt="Карта маршрута" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 8px;">
                        </div>

                        <div class="btn-container mt-3">
                            <button type="button" class="show-route-btn" onclick="showCityOnMap('from')">
                                Посмотреть "Откуда" на карте
                            </button>
                            <button type="button" class="show-route-btn" onclick="showCityOnMap('to')">
                                Посмотреть "Куда" на карте
                            </button>
                            <a href="/route" class="show-route-btn">Показать данные маршрута</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

         <!-- ФУТЕР - САМАЯ НИЖНЯЯ ЧАСТЬ -->
        <footer>
            <div class="footer-authors">
                <span>© 2025 RusRoute, ПсковГУ (Парфенов Р., Журавлев И.)</span>
            </div>
            <div class="footer-links">
                <a href="https://github.com/RParfenov/RusRoute" target="_blank" aria-label="GitHub">GitHub</a>
            </div>
        </footer>

        <!-- Скрипты -->
        <script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>
        <script src="{{ url_for('static', filename='js/index.js') }}"></script>
        <script src="{{ url_for('static', filename='js/create_url.js')}}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
