<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RusRoute — выбор маршрута</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Favicon -->
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='RusRoute.png') }}">
        <!-- Подключение CSS -->
        <link rel="stylesheet" href="{{ url_for('static', filename='plan_style.css') }}">
    </head>
    <body>
        <!-- ШАПКА -->
        <header class="navbar">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <img src="{{ url_for('static', filename='RusRoute.png') }}" alt="Логотип RusRoute">
                    RusRoute
                </a>
                <div>
                    <button class="btn btn-outline-light" onclick="window.location.href='/'">Вернуться на главную</button>
                    <button class="btn btn-outline-light" onclick="window.location.href='/history'">Посмотреть историю</button>
                    <button class="btn btn-outline-light" onclick="window.location.href='/logout'">Выйти из системы</button>
                </div>
            </div>
        </header>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main class="main-content">
            <div class="search-container">
                <div class="city-inputs">
                    <div class="city-card">
                        <span class="city-card-label">Откуда:</span>
                        <div class="autocomplete">
                            <input type="text" id="extra-city1" name="city_from" value="Москва" class="city-input" required>
                        </div>
                    </div>

                    <div class="city-card">
                        <span class="city-card-label">Куда:</span>
                        <div class="autocomplete">
                            <input type="text" id="extra-city2" name="city_to" value="Казань" class="city-input" required>
                        </div>
                    </div>

                    <div class="date-card">
                        <span class="date-card-label">Начало путешествия:</span>
                        <div class="autocomplete">
                            <input type="text" id="extra-date1" name="date-from" value="2025-11-01" class="date-input" required>
                        </div>
                    </div>
                </div>
                <div class="btn-container">
                    <a href="/route" id="show-route-btn" class="show-route-btn">Показать маршрут</a>
                </div>
            </div>

            <div class="route-info">
                <!-- Карта -->
                <div class="map-area">
                    <iframe
                        src="https://www.openstreetmap.org/export/embed.html?bbox=37.6156%2C55.7522%2C37.6325%2C55.7625&amp;layer=mapnik"
                        frameborder="0"
                        scrolling="no"
                        marginheight="0"
                        marginwidth="0"
                        style="border: none; border-radius: 8px; overflow: hidden;">
                    </iframe>
                </div>
            </div>
        </main>

         <!-- ФУТЕР - САМАЯ НИЖНЯЯ ЧАСТЬ -->
        <footer>
            <div class="footer-authors">
                <span>© 2025 RusRoute, ПсковГУ (Парфенов Р., Журавлев И.)</span>
            </div>
            <div class="footer-links">
                <a href="https://github.com/RParfenov/RusRoute" target="_blank" aria-label="GitHub">GitHub</a>
            </div>
        </footer>

        <!-- Скрипты -->
        <script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>
        <script src="{{ url_for('static', filename='js/index.js') }}"></script>
        <script src="{{ url_for('static', filename='js/create_url.js')}}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
