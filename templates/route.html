<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Маршрут: {{ city1 }} - {{ city2 }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='RusRoute.png') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f0f0f0;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1 0 auto;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .image-box {
            position: absolute;
            width: 320px;
            height: 240px;
            border: 3px solid black;
            border-radius: 7px;
            overflow: hidden;
        }

        .box1 {
            left: calc(380px - 160px);
            top: calc(200px - 120px);
        }

        .box2 {
            left: calc(1540px - 160px);
            top: calc(200px - 120px);
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        footer {
            flex-shrink: 0;
            background-color: #fff;
            border-top: 1px solid #ddd;
            padding: 0.5rem 1rem;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .footer-left {
            display: flex;
            align-items: center;
        }

        .footer-right {
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="image-box box1">
            <img src="{{ url_for('static', filename=img1) }}" alt="{{ city1 }}">
        </div>
        <div class="image-box box2">
            <img src="{{ url_for('static', filename=img2) }}" alt="{{ city2 }}">
        </div>
    </div>

    <!-- Футер -->
    <footer>
        <div class="footer-left">
            <a href="/" class="text-body-secondary text-decoration-none lh-1 me-2" aria-label="Bootstrap">
                <svg class="bi" width="30" height="24" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg>
            </a>
            <span class="text-body-secondary">© 2025 RusRoute, ПсковГУ (Парфенов Р. Журавлев И.)</span>
        </div>
        <div class="footer-right">
            <a class="text-body-secondary" href="#" aria-label="Telegram">
                <img src="https://data.chpic.su/stickers/l/LogoIconMa/LogoIconMa_002.webp" width="24" height="24"  alt="Telegram">
            </a>
        </div>
    </footer>

    <!-- Bootstrap JS (если нужно) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
