<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RusRoute — выбор маршрута</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='RusRoute.png') }}">
    <style>
        :root {
            --main-bg: #ff6633;
            --text-dark: #000;
            --border-color: #000;
        }

        body, button, label, input {
            font-family: 'Impact', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* ВСЕ надписи, КРОМЕ RusRoute — Arial */
        *:not(.site-title):not(.logo) {
            font-family: Arial, sans-serif !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fff;
            /* УБРАНО padding-top: 105px — теперь шапка прижата к верху */
            padding-bottom: 50px; /* Отступ под футер */
        }

        /* Шапка — прижата к верху, sticky */
        header {
            height: 54px;
            background-color: black;
            display: flex;
            align-items: center;
            padding: 0 15px;
            position: sticky;
            top: 0;
            z-index: 30;
            width: 100%;
            margin: 0;
        }

        .logo {
            width: 34px;
            height: 34px;
            margin: 9px 0 9px 12px;
        }

        .site-title {
            color: white;
            font-size: 36pt;
            font-weight: bold;
            margin: 0 auto;
            letter-spacing: 1px;
        }

        /* Основной контент */
        main {
            flex: 1;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Городские карточки — 1/4 и 3/4 экрана */
        .city-inputs {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .city-card {
            width: calc(25% - 10px);
            min-width: 200px;
            height: 50px;
            background-color: var(--main-bg);
            border: 3px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city-card-label {
            font-weight: bold;
            color: var(--text-dark);
            white-space: nowrap;
            margin-right: 6px;
        }

        .city-input {
            width: 100px;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            background-color: white;
            color: black;
            text-align: center;
        }

        /* Стили для кнопки "Показать маршрут" */
        .show-route-btn {
            width: 240px;
            height: 48px;
            background-color: #10ff04;
            border: 3px solid black;
            color: black;
            font-family: Arial, sans-serif;
            font-size: 18pt;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px; /* Опционально: скругленные углы */
            transition: background-color 0.2s ease;
        }

        .show-route-btn:hover {
            background-color: green; /* Темнее при наведении */
        }

        /* Информационный блок */
        .route-info {
            width: 100%;
            max-width: 1200px;
            background-color: var(--main-bg);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Белая область — карта (соотношение 4:3) */
        .map-area {
            width: 100%;
            background-color: white;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            /* Соотношение сторон 4:3 */
            padding-top: 56.25%; /* height = width * 3/4 */
        }

        /* Внутри map-area — можно вставить iframe карты или div */
        .map-area > div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18pt;
            color: #666;
        }

        /* Нижняя оранжевая панель — информация */
        .info-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: white; /* или оставить orange? */
            border: 2px solid var(--border-color);
            border-radius: 5px;
            min-height: 80px;
        }

        /* Транспортные иконки */
        .transport-icons {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .transport-btn {
            width: 40px;
            height: 40px;
            background-color: red;
            border: 2px solid black;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .transport-btn.active {
            background-color: #10ff04;
        }

        .transport-btn img {
            width: 30px;
            height: 30px;
        }

        /* Нижняя панель */
        .info-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            font-weight: bold;
            font-size: 18pt;
            color: black;
        }

        .btn-more {
            width: 50px;
            height: 30px;
            background-color: white;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 16pt;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Автозаполнение */
        .autocomplete {
            position: relative;
            display: inline-block;
        }

        .autocomplete-items {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            border: 1px solid #d4d4d4;
            border-top: none;
            z-index: 20;
            background: white;
            max-height: 200px;
            overflow-y: auto;
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
        }

        .autocomplete-items div:hover,
        .autocomplete-active {
            background-color: #bbbbbb;
            color: white;
        }

        /* Футер — прижат к низу */
        footer {
            position: sticky;
            bottom: 0;
            background-color: white;
            border-top: 1px solid #ddd;
            padding: 0.5rem 1rem;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            width: 100%;
            margin: 0; /* Без отступов */
        }

        .footer-left,
        .footer-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        footer a {
            text-decoration: none;
            color: #666;
        }
    </style>
</head>
<body>
    <!-- ШАПКА — САМАЯ ВЕРХНЯЯ ЧАСТЬ СТРАНИЦЫ -->
    <header>
        <img src="{{ url_for('static', filename='RusRoute.png') }}" alt="Логотип RusRoute" class="logo">
        <div class="site-title">RusRoute</div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main>
        <!-- Поля ввода городов -->
        <div class="city-inputs">
            <div class="city-card">
                <span class="city-card-label">Откуда:</span>
                <div class="autocomplete">
                    <input type="text" id="extra-city1" name="city_from" value="Москва" class="city-input" required>
                </div>
            </div>

            <!-- Кнопка "Показать маршрут" -->
            <a href="/route" class="show-route-btn">Показать маршрут</a>

            <div class="city-card">
                <span class="city-card-label">Куда:</span>
                <div class="autocomplete">
                    <input type="text" id="extra-city2" name="city_to" value="Казань" class="city-input" required>
                </div>
            </div>
        </div>

        <div class="route-info">
            <!-- Карта (белая область 4:3) -->
            <div class="map-area">
                <div>Карта будет здесь</div>
            </div>

            <!-- Иконки транспорта -->
            <div class="transport-icons">
                <div class="transport-btn" data-type="plane">
                    <img src="{{ url_for('static', filename='icons/plane.png') }}" alt="Самолёт">
                </div>
                <div class="transport-btn" data-type="train">
                    <img src="{{ url_for('static', filename='icons/train.png') }}" alt="Поезд">
                </div>
                <div class="transport-btn" data-type="car">
                    <img src="{{ url_for('static', filename='icons/car.png') }}" alt="Машина">
                </div>
                <div class="transport-btn" data-type="money">
                    <img src="{{ url_for('static', filename='icons/money.png') }}" alt="Цена">
                </div>
            </div>

            <!-- Нижняя панель с информацией -->
            <div class="info-footer">
                <div class="info-label">Информация:</div>
                <div class="d-flex align-items-center">
                    <span class="info-label me-2">Подробнее:</span>
                    <button type="button" class="btn-more" aria-label="Показать подробности">...</button>
                </div>
            </div>
        </div>
    </main>

    <!-- ФУТЕР — САМАЯ НИЖНЯЯ ЧАСТЬ -->
    <footer>
        <div class="footer-left">
            <span>© 2025 RusRoute, ПсковГУ (Парфенов Р., Журавлев И.)</span>
        </div>
        <div class="footer-right">
            <a href="https://t.me/" target="_blank" aria-label="Telegram">
                <img src="https://data.chpic.su/stickers/l/LogoIconMa/LogoIconMa_002.webp" width="24" height="24" alt="Telegram">
            </a>
        </div>
    </footer>

    <!-- Скрипты -->
    <script>
        // Параллельное переключение стикеров
        document.querySelectorAll('.transport-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('active');
            });
        });
    </script>
    <script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
